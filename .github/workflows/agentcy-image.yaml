# Agentcy: builds the Twenty image from the `agentcy` branch and pushes it to GHCR.
# The server pulls ghcr.io/ethanolle/agentcy-crm:<tag>; deploy steps live in the agentcy ops repo (ops/sops/twenty.md).
name: Agentcy image

on:
  push:
    branches: [agentcy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentcy-image
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ethanolle/agentcy-crm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - name: Tags
        id: meta
        run: |
          UPSTREAM=$(cat agentcy/UPSTREAM_VERSION)
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.meta.outputs.upstream }}
          push: true
          tags: |
            ghcr.io/ethanolle/agentcy-crm:${{ steps.meta.outputs.tag }}
            ghcr.io/ethanolle/agentcy-crm:agentcy
          labels: |
            org.opencontainers.image.source=https://github.com/ethanolle/agentcy-crm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Twenty CRM, Agentcy fork
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Image ghcr.io/ethanolle/agentcy-crm:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
